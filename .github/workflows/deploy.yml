name: CI — Build check

# Valida que el build no rompa antes de que Hostinger haga el deploy.
# Hostinger detecta el push a main y hace el pull+build automáticamente
# usando las variables de entorno configuradas en su panel.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # La contraseña DSS no se inyecta en el bundle — solo va en el servidor.
      # En Hostinger el build lo corre su servidor con las vars del panel.
      - name: Build
        env:
          VITE_DAHUA_HOST: ${{ secrets.VITE_DAHUA_HOST }}
          VITE_DAHUA_USER: ${{ secrets.VITE_DAHUA_USER }}
        run: npm run build

      - name: Check dist exists
        run: test -f dist/index.html && echo "✅ Build OK" || exit 1
