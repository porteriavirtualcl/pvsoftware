name: iOS — Bootstrap (run once)

# Corre este workflow MANUALMENTE una sola vez para generar la carpeta ios/
# y commitearla al repo. Después de eso, no vuelvas a correrlo.

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_DAHUA_HOST: ${{ secrets.VITE_DAHUA_HOST }}
          VITE_DAHUA_USER: ${{ secrets.VITE_DAHUA_USER }}
        run: npm run build

      - name: Add iOS platform
        run: npx cap add ios

      - name: Commit ios/ folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ios/
          git commit -m "chore: add iOS Capacitor project [skip ci]"
          git push
