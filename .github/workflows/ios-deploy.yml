name: iOS — Build & Deploy to App Store

on:
  workflow_dispatch:
    inputs:
      submit_for_review:
        description: 'Enviar a revisión de Apple automáticamente'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_DAHUA_HOST: ${{ secrets.VITE_DAHUA_HOST }}
          VITE_DAHUA_USER: ${{ secrets.VITE_DAHUA_USER }}
        run: npm run build:capacitor

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Set build number
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*/CURRENT_PROJECT_VERSION = $BUILD_NUMBER/g" ios/App/App.xcodeproj/project.pbxproj
          echo "Build number set to $BUILD_NUMBER"
          grep "CURRENT_PROJECT_VERSION" ios/App/App.xcodeproj/project.pbxproj

      - name: Select Xcode 26
        run: |
          XCODE26=$(ls /Applications/ | grep -i "Xcode_26" | head -1)
          if [ -n "$XCODE26" ]; then
            sudo xcode-select -s /Applications/$XCODE26/Contents/Developer
            echo "Using $XCODE26"
          else
            echo "Xcode 26 not found, available versions:"
            ls /Applications/ | grep -i xcode
          fi
          xcodebuild -version

      # Desde Xcode 16 las plataformas son componentes aparte, y la imagen de
      # macos-latest puede traer Xcode SIN el SDK de iOS. Sin él no existe el
      # destino 'generic/platform=iOS' y el archive muere con exit 70:
      # "iOS 26.0 is not installed. Please download and install the platform".
      # Esto rompió el run #40 (09-09-2026); el #39 pasó porque la imagen del
      # runner todavía traía el SDK.
      - name: Ensure iOS platform SDK
        run: |
          if xcodebuild -showsdks 2>/dev/null | grep -q "iphoneos"; then
            echo "SDK de iOS ya presente."
          else
            echo "SDK de iOS ausente — descargando la plataforma (puede tardar varios minutos)…"
            sudo xcodebuild -downloadPlatform iOS
          fi
          echo "--- SDKs disponibles ---"
          xcodebuild -showsdks
          if ! xcodebuild -showsdks 2>/dev/null | grep -q "iphoneos"; then
            echo "::error::Sigue sin haber SDK de iOS tras la descarga. Xcodes en la imagen:"
            ls /Applications/ | grep -i xcode
            exit 1
          fi

      - name: Generate 1024x1024 App Icon
        run: |
          ICON_OUT=ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          # Resize to 1024x1024
          sips -z 1024 1024 public/icon-512.png --out $RUNNER_TEMP/icon_resized.png
          # Strip alpha channel by converting through JPEG (JPEG has no alpha)
          sips -s format jpeg $RUNNER_TEMP/icon_resized.png --out $RUNNER_TEMP/icon_no_alpha.jpg
          sips -s format png $RUNNER_TEMP/icon_no_alpha.jpg --out "$ICON_OUT"
          echo "Icon generated. Alpha check:"
          sips -g hasAlpha "$ICON_OUT"


      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App

      # ── Code signing ────────────────────────────────────────────────────────
      - name: Install Apple Distribution Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DIST_CERT_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          CERT_PATH=$RUNNER_TEMP/cert.p12

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      # ── Xcode build ─────────────────────────────────────────────────────────
      - name: Set up App Store Connect API Key
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_BASE64" | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8

      - name: Build & Archive
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_API_KEY_ID }}
          API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_API_KEY_ISSUER_ID }}
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8 \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_KEY_ISSUER_ID" \
            archive

      - name: Export IPA
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>cl.porteriavirtual.app</key>
              <string>Porteria Virtual App Store</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -allowProvisioningUpdates

      - name: Upload to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_API_KEY_ID }}
          API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_API_KEY_ISSUER_ID }}
        run: |
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/App.ipa" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_KEY_ISSUER_ID"

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/build.keychain || true
