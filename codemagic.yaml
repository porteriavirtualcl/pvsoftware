workflows:
  ios-simulator:
    name: iOS — Simulator Build
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web assets
        script: npm run build:capacitor
      - name: Capacitor add iOS platform
        script: |
          npx cap add ios
          echo "=== cap add ios exit code: $? ==="
          echo "=== ios/ contents after cap add ==="
          find ios -maxdepth 5 2>/dev/null || echo "ios/ directory does not exist"
      - name: Capacitor sync iOS
        script: |
          npx cap sync ios
          echo "=== cap sync ios exit code: $? ==="
      - name: Install CocoaPods
        script: |
          echo "=== Searching for Podfile ==="
          find ios -name "Podfile" 2>/dev/null || echo "No Podfile found"
          echo "=== Running pod install ==="
          pod install --project-directory=ios/App
      - name: Build for simulator
        script: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath ios/build \
            build
    artifacts:
      - ios/build/Build/Products/**/*.app
