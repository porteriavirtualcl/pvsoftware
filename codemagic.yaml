workflows:
  ios-testflight:
    name: iOS — TestFlight Distribution
    max_build_duration: 90
    environment:
      groups:
        - Secure
      ios_signing:
        distribution_type: app_store
        bundle_identifier: cl.porteriavirtual.app
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web assets
        script: npm run build:capacitor
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Resolve SPM packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

  ios-simulator:
    name: iOS — Simulator Build
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web assets
        script: npm run build:capacitor
      - name: Capacitor add iOS platform
        script: npx cap add ios
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Resolve SPM packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -derivedDataPath ios/build
      - name: Build for simulator
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath ios/build \
            build
    artifacts:
      - ios/build/Build/Products/**/*.app
