workflows:
  ios-simulator:
    name: iOS — Simulator Build
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web assets
        script: npm run build:capacitor
      - name: Capacitor add iOS platform
        script: npx cap add ios
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Debug - find Podfile location
        script: find ios -type f -name "Podfile" 2>/dev/null || echo "No Podfile found anywhere in ios/"
      - name: Install CocoaPods
        script: pod install --project-directory=ios/App
      - name: Build for simulator
        script: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath ios/build \
            build
    artifacts:
      - ios/build/Build/Products/**/*.app
